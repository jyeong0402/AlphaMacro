services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: alphamacro
      POSTGRES_USER: alphamacro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alphamacro}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphamacro -d alphamacro"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
